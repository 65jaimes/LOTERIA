<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lotería — Cantor Digital</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..800&family=Work+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #1c1338;
    --bg-soft: #241a47;
    --panel: #2c2050;
    --ink: #f5ecd8;
    --ink-dim: #c9bfe6;
    --pink: #e6497f;
    --gold: #f2a93b;
    --teal: #2fb8ac;
    --line: rgba(245,236,216,0.14);
    --radius: 18px;
  }

  *{box-sizing:border-box;}

  body{
    margin:0;
    min-height:100vh;
    background:
      radial-gradient(circle at 15% 10%, rgba(230,73,127,0.18), transparent 45%),
      radial-gradient(circle at 85% 85%, rgba(47,184,172,0.16), transparent 50%),
      var(--bg);
    color:var(--ink);
    font-family:'Work Sans', sans-serif;
    display:flex;
    justify-content:center;
    padding:28px 16px 60px;
  }

  .app{ width:100%; max-width:640px; }

  header{ text-align:center; margin-bottom:22px; }
  header h1{
    font-family:'Bricolage Grotesque', sans-serif;
    font-weight:800;
    font-size:2.1rem;
    margin:0 0 4px;
    letter-spacing:-0.01em;
    color:var(--gold);
  }
  header p{ margin:0; color:var(--ink-dim); font-size:0.95rem; }

  .board{
    background: var(--bg-soft);
    border:1px solid var(--line);
    border-radius: var(--radius);
    padding:26px 22px;
    text-align:center;
    position:relative;
    overflow:hidden;
  }
  .board::before{
    content:"";
    position:absolute; inset:0;
    background: repeating-linear-gradient(115deg, transparent 0 38px, rgba(245,236,216,0.03) 38px 40px);
    pointer-events:none;
  }

  .counter{ color:var(--ink-dim); font-size:0.85rem; margin-bottom:10px; letter-spacing:0.02em; }

  .card{
    background: linear-gradient(160deg, var(--panel), var(--bg-soft));
    border:3px solid var(--gold);
    border-radius:14px;
    padding:16px;
    min-height:200px;
    position:relative;
  }
  .card::before{
    content:"";
    position:absolute; inset:8px;
    border:1px solid rgba(245,236,216,0.35);
    border-radius:8px;
    pointer-events:none;
  }
  .card .frame-inner{
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    gap:10px;
    min-height:168px;
  }
  .card .card-img{
    width:120px;
    height:120px;
    object-fit:contain;
    display:none;
  }
  .card .emoji{ font-size:4.2rem; line-height:1; }
  .card .name{
    font-family:'Bricolage Grotesque', sans-serif;
    font-weight:700;
    font-size:1.7rem;
    text-transform:uppercase;
    letter-spacing:0.02em;
  }
  .card .number{ color:var(--ink-dim); font-size:0.85rem; }

  /* Reusable mini card frame, used for player boards */
  .mini-card{
    background: linear-gradient(160deg, var(--panel), var(--bg-soft));
    border:2px solid var(--gold);
    border-radius:8px;
    position:relative;
    aspect-ratio:3/4;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    gap:2px;
    cursor:pointer;
    user-select:none;
    padding:4px;
    overflow:hidden;
  }
  .mini-card::before{
    content:"";
    position:absolute; inset:3px;
    border:1px solid rgba(245,236,216,0.3);
    border-radius:5px;
    pointer-events:none;
  }
  .mini-card .mini-emoji{ font-size:1.5rem; line-height:1; }
  .mini-card .mini-img{
    width:70%;
    height:55%;
    object-fit:contain;
    display:none;
  }
  .mini-card .mini-name{
    font-size:0.55rem;
    text-align:center;
    text-transform:uppercase;
    letter-spacing:0.01em;
    color:var(--ink-dim);
    line-height:1.1;
  }
  .mini-card.marked::after{
    content:"🫘";
    position:absolute;
    inset:0;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:2rem;
    background:rgba(20,10,10,0.45);
    border-radius:6px;
  }
  .mini-card.win-cell{
    outline:2px solid var(--teal);
  }

  .waiting-msg{ font-size:0.9rem; color:var(--ink-dim); margin-top:4px; min-height:1.2em; }

  .controls{
    display:flex;
    gap:10px;
    justify-content:center;
    flex-wrap:wrap;
    margin-top:20px;
  }
  button{
    font-family:'Work Sans', sans-serif;
    font-weight:600;
    font-size:0.95rem;
    border:none;
    border-radius:999px;
    padding:12px 22px;
    cursor:pointer;
    transition: transform .12s ease;
  }
  button:active{ transform: scale(0.96); }
  .btn-primary{ background:var(--pink); color:#fff; }
  .btn-secondary{ background:transparent; border:1px solid var(--line); color:var(--ink); }
  .btn-secondary:hover{ border-color:var(--gold); }
  button:disabled{ opacity:0.45; cursor:not-allowed; }

  .history{
    margin-top:22px;
  }
  .history h2{
    font-family:'Bricolage Grotesque', sans-serif;
    font-size:1rem;
    color:var(--teal);
    margin:0 0 8px;
  }
  .history-list{
    display:flex;
    flex-wrap:wrap;
    gap:6px;
  }
  .history-list span{
    background:var(--panel);
    border:1px solid var(--line);
    border-radius:8px;
    padding:5px 9px;
    font-size:0.8rem;
    color:var(--ink-dim);
  }

  details{
    margin-top:24px;
    background:var(--bg-soft);
    border:1px solid var(--line);
    border-radius:var(--radius);
    padding:4px 18px;
  }
  summary{
    cursor:pointer;
    padding:14px 0;
    font-weight:600;
    color:var(--gold);
    list-style:none;
  }
  summary::-webkit-details-marker{ display:none; }
  .settings-grid{
    display:grid;
    grid-template-columns:1fr;
    gap:16px;
    padding-bottom:20px;
  }
  .field label{
    display:block;
    font-size:0.85rem;
    color:var(--ink-dim);
    margin-bottom:6px;
  }
  select, input[type=number]{
    width:100%;
    padding:10px 12px;
    border-radius:10px;
    border:1px solid var(--line);
    background:var(--panel);
    color:var(--ink);
    font-family:'Work Sans', sans-serif;
    font-size:0.9rem;
  }
  input[type=range]{ width:100%; }
  .range-row{ display:flex; align-items:center; gap:10px; }
  .range-row span{ font-size:0.85rem; color:var(--ink-dim); min-width:48px; text-align:right; }

  .color-row{ display:flex; gap:14px; flex-wrap:wrap; }
  .swatch{ display:flex; flex-direction:column; align-items:center; gap:6px; font-size:0.78rem; color:var(--ink-dim); }
  input[type=color]{
    width:44px; height:44px;
    border:none; border-radius:50%;
    padding:0; cursor:pointer;
    background:none;
  }

  .checkbox-row{ display:flex; align-items:center; gap:8px; }
  .checkbox-row input{ width:18px; height:18px; }

  .boards-setup .field{ margin-bottom:12px; }
  .board-tabs{
    display:flex;
    gap:6px;
    flex-wrap:wrap;
    margin:14px 0 10px;
  }
  .board-tab{
    background:var(--panel);
    border:1px solid var(--line);
    color:var(--ink-dim);
    border-radius:999px;
    padding:8px 14px;
    font-size:0.82rem;
    font-weight:600;
    cursor:pointer;
  }
  .board-tab.active{
    background:var(--teal);
    color:#0d1b1a;
    border-color:var(--teal);
  }
  .player-board{ display:none; }
  .player-board.active{ display:block; }
  .player-board-name{
    background:transparent;
    border:none;
    border-bottom:1px dashed var(--line);
    color:var(--ink);
    font-family:'Bricolage Grotesque', sans-serif;
    font-size:1.1rem;
    font-weight:700;
    padding:4px 2px;
    margin-bottom:10px;
    width:100%;
  }
  .board-grid{
    display:grid;
    grid-template-columns:repeat(4, 1fr);
    gap:6px;
  }
  .board-status{
    margin-top:10px;
    font-size:0.85rem;
    color:var(--ink-dim);
    min-height:1.2em;
  }

  footer{
    text-align:center;
    margin-top:26px;
    font-size:0.78rem;
    color:var(--ink-dim);
  }

  @media (prefers-reduced-motion: reduce){
    button{ transition:none; }
  }
</style>
</head>
<body>
<div class="app">

  <header>
    <h1>Lotería</h1>
    <p>Cantor digital — barajea, canta y juega en familia</p>
  </header>

  <div class="board">
    <div class="counter" id="counter">Carta 0 de 54</div>
    <div class="card">
      <div class="frame-inner">
        <img class="card-img" id="cardImg" alt="">
        <div class="emoji" id="cardEmoji">🎴</div>
        <div class="name" id="cardName">Toca "Barajar" para empezar</div>
        <div class="number" id="cardNumber">&nbsp;</div>
      </div>
    </div>
    <div class="waiting-msg" id="waitingMsg">&nbsp;</div>

    <div class="controls">
      <button class="btn-primary" id="shuffleBtn">🔀 Barajar</button>
      <button class="btn-secondary" id="nextBtn" disabled>➡️ Siguiente carta</button>
      <button class="btn-secondary" id="autoBtn" disabled>▶️ Modo automático</button>
      <button class="btn-secondary" id="repeatBtn" disabled>🔊 Repetir</button>
    </div>
  </div>

  <div class="history">
    <h2>Cartas cantadas</h2>
    <div class="history-list" id="historyList"></div>
  </div>

  <div class="boards-section">
    <h2 style="font-family:'Bricolage Grotesque', sans-serif; font-size:1rem; color:var(--pink); margin:24px 0 8px;">Tableros de jugadores</h2>
    <div class="boards-setup">
      <div class="field">
        <label for="playerCount">Número de jugadores</label>
        <input type="number" id="playerCount" min="1" max="10" value="2">
      </div>
      <div class="field">
        <label for="winPattern">Patrón para ganar</label>
        <select id="winPattern">
          <option value="linea">Línea (fila, columna o diagonal)</option>
          <option value="tabla">Tabla llena (las 16 cartas)</option>
        </select>
      </div>
      <div class="controls" style="margin-top:6px;">
        <button class="btn-primary" id="genBoardsBtn">🎲 Generar tableros</button>
      </div>
    </div>

    <div class="board-tabs" id="boardTabs"></div>
    <div id="boardsContainer"></div>
  </div>

  <details>
    <summary>⚙️ Configuración</summary>
    <div class="settings-grid">

      <div class="field">
        <label for="voiceSelect">Voz para cantar las cartas</label>
        <select id="voiceSelect"></select>
      </div>

      <div class="field">
        <label for="waitRange">Tiempo de espera entre cartas (modo automático)</label>
        <div class="range-row">
          <input type="range" id="waitRange" min="2" max="20" step="1" value="6">
          <span id="waitValue">6 s</span>
        </div>
      </div>

      <div class="field">
        <label>Colores de la app</label>
        <div class="color-row">
          <div class="swatch">
            <input type="color" id="colorBg" value="#1c1338">
            Fondo
          </div>
          <div class="swatch">
            <input type="color" id="colorPanel" value="#2c2050">
            Carta
          </div>
          <div class="swatch">
            <input type="color" id="colorAccent" value="#f2a93b">
            Acento
          </div>
          <div class="swatch">
            <input type="color" id="colorInk" value="#f5ecd8">
            Texto
          </div>
        </div>
      </div>

      <div class="checkbox-row">
        <input type="checkbox" id="voiceOnly">
        <label for="voiceOnly" style="margin:0;">Solo audio (ocultar nombre de la carta en pantalla)</label>
      </div>

    </div>
  </details>

  <footer>Barajea antes de cada partida · pensado para jugarse con tableros físicos o impresos</footer>
</div>

<script>
  const DECK = [
    ["El Gallo","🐓"],["El Diablito","😈"],["La Dama","💃"],["El Catrín","🎩"],
    ["El Paraguas","☂️"],["La Sirena","🧜‍♀️"],["La Escalera","🪜"],["La Botella","🍾"],
    ["El Barril","🛢️"],["El Árbol","🌳"],["El Melón","🍈"],["El Valiente","🗡️"],
    ["El Gorrito","🧢"],["La Muerte","💀"],["La Pera","🍐"],["La Bandera","🚩"],
    ["El Bandolón","🪕"],["El Violonchelo","🎻"],["La Garza","🦩"],["El Pájaro","🐦"],
    ["La Mano","✋"],["La Bota","🥾"],["La Luna","🌙"],["El Cotorro","🦜"],
    ["El Borracho","🍺"],["El Negrito","🎶"],["El Corazón","❤️"],["La Sandía","🍉"],
    ["El Tambor","🥁"],["El Camarón","🦐"],["Las Jaras","🏹"],["El Músico","🎺"],
    ["La Araña","🕷️"],["El Soldado","💂"],["La Estrella","⭐"],["El Cazo","🍲"],
    ["El Mundo","🌎"],["El Apache","🪶"],["El Nopal","🌵"],["El Alacrán","🦂"],
    ["La Rosa","🌹"],["La Calavera","☠️"],["La Campana","🔔"],["El Cantarito","🏺"],
    ["El Venado","🦌"],["El Sol","☀️"],["La Corona","👑"],["La Chalupa","🛶"],
    ["El Pino","🌲"],["El Pescado","🐟"],["La Palma","🌴"],["La Maceta","🪴"],
    ["El Arpa","🎼"],["La Rana","🐸"]
  ];

  let deck = [];
  let currentIndex = -1;
  let autoMode = false;
  let autoTimer = null;
  let voices = [];
  let calledNames = new Set();
  let boards = [];       // one array of 16 [name,emoji] per player
  let activeBoard = 0;

  const els = {
    counter: document.getElementById('counter'),
    cardEmoji: document.getElementById('cardEmoji'),
    cardImg: document.getElementById('cardImg'),
    cardName: document.getElementById('cardName'),
    cardNumber: document.getElementById('cardNumber'),
    waitingMsg: document.getElementById('waitingMsg'),
    shuffleBtn: document.getElementById('shuffleBtn'),
    nextBtn: document.getElementById('nextBtn'),
    autoBtn: document.getElementById('autoBtn'),
    repeatBtn: document.getElementById('repeatBtn'),
    historyList: document.getElementById('historyList'),
    voiceSelect: document.getElementById('voiceSelect'),
    waitRange: document.getElementById('waitRange'),
    waitValue: document.getElementById('waitValue'),
    voiceOnly: document.getElementById('voiceOnly'),
    playerCount: document.getElementById('playerCount'),
    winPattern: document.getElementById('winPattern'),
    genBoardsBtn: document.getElementById('genBoardsBtn'),
    boardTabs: document.getElementById('boardTabs'),
    boardsContainer: document.getElementById('boardsContainer'),
    colorBg: document.getElementById('colorBg'),
    colorPanel: document.getElementById('colorPanel'),
    colorAccent: document.getElementById('colorAccent'),
    colorInk: document.getElementById('colorInk'),
  };

  function shuffle(array){
    const a = array.slice();
    for(let i = a.length - 1; i > 0; i--){
      const j = Math.floor(Math.random() * (i + 1));
      [a[i], a[j]] = [a[j], a[i]];
    }
    return a;
  }

  // ---------- Imágenes de cartas ----------
  // Carpeta esperada: "cards/" junto al archivo HTML.
  // La app prueba, en orden, varios nombres de archivo posibles para cada
  // carta, hasta encontrar uno que exista. Si no encuentra ninguno, muestra
  // el emoji de respaldo.
  const IMG_FOLDER = 'cards/';

  function slugify(name){
    return name
      .toLowerCase()
      .normalize('NFD').replace(/[\u0300-\u036f]/g, '')
      .replace(/[^a-z0-9]+/g, '-')
      .replace(/(^-|-$)/g, '');
  }

  // Nombres alternativos por si tus archivos usan otra palabra (o una variante
  // de escritura distinta) para la misma carta.
  const NAME_ALIASES = {
    "El Gallo": ["El Gallo", "El Gallito"],
    "El Cantarito": ["El Cantarito", "El Jarron", "El Jarrón"],
    "El Valiente": ["El Valiente", "El Charro"],
    "El Bandolón": ["El Bandolón", "El Bandonol"],
    "El Venado": ["El Venado", "El Veneado"],
    "El Violonchelo": ["El Violonchelo", "El Violoncello", "El Violocenllo"],
  };

  // Genera la lista de rutas candidatas para una carta, en el orden en que se prueban.
  function cardImgCandidates(name){
    const names = NAME_ALIASES[name] || [name];
    const candidates = [];
    names.forEach(n => {
      const lower = n.toLowerCase();
      const noAccent = lower.normalize('NFD').replace(/[\u0300-\u036f]/g, '');
      const underscoreNoAccent = noAccent.replace(/\s+/g, '_');
      // 1) minúsculas + espacios, CON acento (como a veces se ven tus archivos)
      // 2) igual pero SIN acento (por si el archivo se guardó sin tilde)
      [lower, noAccent].forEach(v => {
        candidates.push(`${IMG_FOLDER}${v}.jpg`);
        candidates.push(`${IMG_FOLDER}${v}.jpeg`);
        candidates.push(`${IMG_FOLDER}${v}.png`);
      });
      // 3) minúsculas + guion_bajo, sin acentos, .png/.jpg (tu convención actual)
      candidates.push(`${IMG_FOLDER}${underscoreNoAccent}.png`);
      candidates.push(`${IMG_FOLDER}${underscoreNoAccent}.jpg`);
      candidates.push(`${IMG_FOLDER}${underscoreNoAccent}.jpeg`);
      // 4) formato "slug" (sin espacios/acentos, con guiones) en svg/png/jpg
      const slug = slugify(n);
      candidates.push(`${IMG_FOLDER}${slug}.svg`);
      candidates.push(`${IMG_FOLDER}${slug}.png`);
      candidates.push(`${IMG_FOLDER}${slug}.jpg`);
    });
    return [...new Set(candidates)];
  }

  // Prueba cada ruta candidata en orden; si ninguna carga, deja el emoji visible.
  function setCardVisual(imgEl, emojiEl, name, emoji){
    const candidates = cardImgCandidates(name);
    let i = 0;
    emojiEl.textContent = emoji;
    emojiEl.style.display = '';
    imgEl.style.display = 'none';
    function tryNext(){
      if(i >= candidates.length){
        console.debug(`[Lotería] No se encontró imagen para "${name}". Se probaron ${candidates.length} rutas, ninguna existe en la carpeta cards/.`);
        return;
      }
      imgEl.onerror = () => { i++; tryNext(); };
      imgEl.onload = () => {
        imgEl.style.display = 'block';
        emojiEl.style.display = 'none';
      };
      imgEl.src = encodeURI(candidates[i]);
    }
    tryNext();
  }

  function loadVoices(){
    try{
      voices = speechSynthesis.getVoices();
      // Prefer Spanish voices at the top of the list
      voices.sort((a,b) => {
        const aEs = a.lang.startsWith('es') ? 0 : 1;
        const bEs = b.lang.startsWith('es') ? 0 : 1;
        return aEs - bEs;
      });
      els.voiceSelect.innerHTML = '';
      voices.forEach((v, i) => {
        const opt = document.createElement('option');
        opt.value = i;
        opt.textContent = `${v.name} (${v.lang})`;
        els.voiceSelect.appendChild(opt);
      });
      if(voices.length === 0){
        const opt = document.createElement('option');
        opt.textContent = 'Voz del sistema no disponible';
        els.voiceSelect.appendChild(opt);
      }
    } catch(e){
      console.warn('No se pudieron cargar las voces del sistema:', e);
      els.voiceSelect.innerHTML = '<option>Voz no disponible en este navegador</option>';
    }
  }
  if('speechSynthesis' in window){
    speechSynthesis.onvoiceschanged = loadVoices;
    loadVoices();
  } else {
    els.voiceSelect.innerHTML = '<option>Este navegador no soporta voz</option>';
  }

  function speak(text){
    if(!('speechSynthesis' in window)) return;
    try{
      speechSynthesis.cancel();
      const utter = new SpeechSynthesisUtterance(text);
      const idx = els.voiceSelect.value;
      if(voices[idx]) utter.voice = voices[idx];
      utter.rate = 0.95;
      speechSynthesis.speak(utter);
    } catch(e){
      console.warn('No se pudo reproducir la voz:', e);
    }
  }

  function newGame(){
    deck = shuffle(DECK);
    currentIndex = -1;
    calledNames = new Set();
    els.historyList.innerHTML = '';
    els.counter.textContent = `Carta 0 de ${deck.length}`;
    els.cardEmoji.textContent = '🎴';
    els.cardImg.style.display = 'none';
    els.cardEmoji.style.display = '';
    els.cardName.textContent = 'Listo para cantar';
    els.cardNumber.textContent = '\u00A0';
    els.waitingMsg.textContent = '\u00A0';
    els.nextBtn.disabled = false;
    els.autoBtn.disabled = false;
    els.repeatBtn.disabled = true;
    stopAuto();
  }

  function showCard(){
    if(currentIndex >= deck.length - 1){
      els.waitingMsg.textContent = 'Ya se cantaron todas las cartas. ¡Barajea para jugar otra vez!';
      els.nextBtn.disabled = true;
      els.autoBtn.disabled = true;
      stopAuto();
      return;
    }
    currentIndex++;
    const [name, emoji] = deck[currentIndex];
    els.counter.textContent = `Carta ${currentIndex + 1} de ${deck.length}`;
    els.cardNumber.textContent = `#${currentIndex + 1}`;
    if(els.voiceOnly.checked){
      els.cardImg.style.display = 'none';
      els.cardEmoji.style.display = '';
      els.cardEmoji.textContent = '🔊';
      els.cardName.textContent = 'Escuchando...';
    } else {
      setCardVisual(els.cardImg, els.cardEmoji, name, emoji);
      els.cardName.textContent = name;
    }
    els.repeatBtn.disabled = false;
    calledNames.add(name);
    speak(name);

    const chip = document.createElement('span');
    chip.textContent = `${currentIndex + 1}. ${name}`;
    els.historyList.appendChild(chip);
    els.historyList.scrollTop = els.historyList.scrollHeight;

    if(autoMode){
      const waitSec = parseInt(els.waitRange.value, 10);
      let remaining = waitSec;
      els.waitingMsg.textContent = `Siguiente carta en ${remaining}s...`;
      clearInterval(autoTimer);
      autoTimer = setInterval(() => {
        remaining--;
        if(remaining <= 0){
          clearInterval(autoTimer);
          showCard();
        } else {
          els.waitingMsg.textContent = `Siguiente carta en ${remaining}s...`;
        }
      }, 1000);
    } else {
      els.waitingMsg.textContent = '\u00A0';
    }
  }

  function stopAuto(){
    autoMode = false;
    clearInterval(autoTimer);
    els.autoBtn.textContent = '▶️ Modo automático';
  }

  els.shuffleBtn.addEventListener('click', newGame);

  els.nextBtn.addEventListener('click', () => {
    if(autoMode) stopAuto();
    showCard();
  });

  els.autoBtn.addEventListener('click', () => {
    if(autoMode){
      stopAuto();
      els.waitingMsg.textContent = '\u00A0';
    } else {
      autoMode = true;
      els.autoBtn.textContent = '⏸️ Pausar automático';
      showCard();
    }
  });

  els.repeatBtn.addEventListener('click', () => {
    if(currentIndex >= 0){
      speak(deck[currentIndex][0]);
    }
  });

  els.waitRange.addEventListener('input', () => {
    els.waitValue.textContent = `${els.waitRange.value} s`;
  });

  function applyColors(){
    const root = document.documentElement.style;
    root.setProperty('--bg', els.colorBg.value);
    root.setProperty('--panel', els.colorPanel.value);
    root.setProperty('--gold', els.colorAccent.value);
    root.setProperty('--ink', els.colorInk.value);
  }
  [els.colorBg, els.colorPanel, els.colorAccent, els.colorInk].forEach(input => {
    input.addEventListener('input', applyColors);
  });

  els.voiceOnly.addEventListener('change', () => {
    if(currentIndex >= 0 && currentIndex < deck.length){
      const [name, emoji] = deck[currentIndex];
      if(els.voiceOnly.checked){
        els.cardImg.style.display = 'none';
        els.cardEmoji.style.display = '';
        els.cardEmoji.textContent = '🔊';
        els.cardName.textContent = 'Escuchando...';
      } else {
        setCardVisual(els.cardImg, els.cardEmoji, name, emoji);
        els.cardName.textContent = name;
      }
    }
  });

  // ---------- Tableros de jugadores ----------

  function generateBoards(){
    const count = Math.min(10, Math.max(1, parseInt(els.playerCount.value, 10) || 1));
    boards = [];
    for(let p = 0; p < count; p++){
      boards.push({
        name: `Jugador ${p + 1}`,
        cells: shuffle(DECK).slice(0, 16).map(c => ({ name: c[0], emoji: c[1], marked: false }))
      });
    }
    activeBoard = 0;
    renderBoardTabs();
    renderBoards();
  }

  function renderBoardTabs(){
    els.boardTabs.innerHTML = '';
    boards.forEach((b, i) => {
      const tab = document.createElement('button');
      tab.className = 'board-tab' + (i === activeBoard ? ' active' : '');
      tab.textContent = b.name;
      tab.addEventListener('click', () => {
        activeBoard = i;
        renderBoardTabs();
        renderBoards();
      });
      els.boardTabs.appendChild(tab);
    });
  }

  function renderBoards(){
    els.boardsContainer.innerHTML = '';
    boards.forEach((b, i) => {
      const wrap = document.createElement('div');
      wrap.className = 'player-board' + (i === activeBoard ? ' active' : '');

      const nameInput = document.createElement('input');
      nameInput.className = 'player-board-name';
      nameInput.value = b.name;
      nameInput.addEventListener('input', () => {
        b.name = nameInput.value || `Jugador ${i + 1}`;
        renderBoardTabs();
      });
      wrap.appendChild(nameInput);

      const grid = document.createElement('div');
      grid.className = 'board-grid';
      b.cells.forEach((cell) => {
        const cardEl = document.createElement('div');
        cardEl.className = 'mini-card' + (cell.marked ? ' marked' : '');
        cardEl.innerHTML = `<img class="mini-img" alt=""><div class="mini-emoji">${cell.emoji}</div><div class="mini-name">${cell.name}</div>`;
        const miniImg = cardEl.querySelector('.mini-img');
        const miniEmoji = cardEl.querySelector('.mini-emoji');
        setCardVisual(miniImg, miniEmoji, cell.name, cell.emoji);
        cardEl.addEventListener('click', () => {
          cell.marked = !cell.marked;
          renderBoards();
        });
        grid.appendChild(cardEl);
      });
      wrap.appendChild(grid);

      const controls = document.createElement('div');
      controls.className = 'controls';
      controls.style.marginTop = '12px';
      const checkBtn = document.createElement('button');
      checkBtn.className = 'btn-primary';
      checkBtn.textContent = '🏆 ¡Lotería!';
      checkBtn.addEventListener('click', () => checkWin(i));
      controls.appendChild(checkBtn);
      wrap.appendChild(controls);

      const status = document.createElement('div');
      status.className = 'board-status';
      status.id = `boardStatus-${i}`;
      wrap.appendChild(status);

      els.boardsContainer.appendChild(wrap);
    });
  }

  function playBell(){
    try{
      const ctx = new (window.AudioContext || window.webkitAudioContext)();
      const now = ctx.currentTime;
      const freqs = [880, 1318.5, 1760]; // bell-like overtones
      freqs.forEach((freq, i) => {
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.type = 'sine';
        osc.frequency.value = freq;
        const startAt = now + i * 0.12;
        gain.gain.setValueAtTime(0, startAt);
        gain.gain.linearRampToValueAtTime(0.28 / (i + 1), startAt + 0.02);
        gain.gain.exponentialRampToValueAtTime(0.001, startAt + 1.6);
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.start(startAt);
        osc.stop(startAt + 1.7);
      });
      setTimeout(() => ctx.close(), 2200);
    } catch(e){ /* audio not available */ }
  }

  function checkWin(boardIndex){
    const b = boards[boardIndex];
    const statusEl = document.getElementById(`boardStatus-${boardIndex}`);
    const pattern = els.winPattern.value;
    const marks = b.cells.map(c => c.marked);

    const lines = [];
    for(let r = 0; r < 4; r++) lines.push([0,1,2,3].map(c => r * 4 + c));
    for(let c = 0; c < 4; c++) lines.push([0,1,2,3].map(r => r * 4 + c));
    lines.push([0,5,10,15]);
    lines.push([3,6,9,12]);

    let winningIndices = null;
    if(pattern === 'tabla'){
      if(marks.every(m => m)) winningIndices = b.cells.map((_, idx) => idx);
    } else {
      for(const line of lines){
        if(line.every(idx => marks[idx])){ winningIndices = line; break; }
      }
    }

    if(!winningIndices){
      statusEl.textContent = 'Todavía no completa el patrón. ¡Sigue marcando!';
      statusEl.style.color = 'var(--pink)';
      return;
    }

    const allWereCalled = winningIndices.every(idx => calledNames.has(b.cells[idx].name));
    if(!allWereCalled){
      statusEl.textContent = 'Hay cartas marcadas que no se han cantado todavía. ¡Revisa tu tablero!';
      statusEl.style.color = 'var(--pink)';
      return;
    }

    statusEl.textContent = `¡${b.name} gritó Lotería y ganó! 🎉`;
    statusEl.style.color = 'var(--teal)';
    playBell();
  }

  els.genBoardsBtn.addEventListener('click', generateBoards);

  // initial idle state
  els.counter.textContent = `Carta 0 de ${DECK.length}`;
  generateBoards();
</script>
</body>
</html>
